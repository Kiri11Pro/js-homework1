<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON - Task 1</title>
    <script>
        window.onload = () => {
            document.querySelector("button").addEventListener("click", clickHandler);

            function clickHandler(e) {
                document.querySelector("h1").childNodes.forEach(el => {
                    if (el.nodeType === Node.ELEMENT_NODE)
                        el.remove()
                });
                try {
                    let text = document.querySelector("#before").value;
                    let obj = JSON.parse(text);
                    let formattedText = JSON.stringify(obj, null, 4);
                    document.querySelector("#after").value = formattedText;
                } catch (e) {
                    let span = document.createElement("span");
                    span.innerText = "[format error]";
                    span.style.color = "red";
                    span.style.marginLeft = "23%";
                    document.querySelector("h1").appendChild(span);
                }
            }
        }
    </script>
    <style>* {
        padding: 0;
        margin: 0;
    }

    h1 {
        height: 50px;
    }

    section {
        width: 35%;
        height: 500px;
    }

    main {
        display: flex;
    }

    section:nth-child(2) {
        width: 5%;
        padding-right: 0.5%;
        padding-left: 0.5%;
    }

    textarea {
        width: 100%;
        height: 100%;
    }

    button {
        margin-top: 50px;
        width: 100%;
        height: 100%;
    }
    </style>
</head>
<body>
<main>
    <section>
        <h1> Enter JSON data:</h1>
        <label>
            <textarea id="before"></textarea>
        </label>
    </section>
    <section>
        <button>&#128898</button>
    </section>
    <section><h1>Formatted JSON data:</h1>
        <label>
            <textarea id="after"></textarea>
        </label>
    </section>
</main>

</body>
</html>
