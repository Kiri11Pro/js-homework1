<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HtmlElement</title>
    <!--    Реализовать класс, описывающий html элемент.-->
    <!--    Класс HtmlElement должен содержать внутри себя:-->
    <!--    ■ название тега;-->
    <!--    ■ самозакрывающийся тег или нет;-->
    <!--    ■ текстовое содержимое;-->
    <!--    ■ массив атрибутов;-->
    <!--    ■ массив стилей;-->
    <!--    ■ массив вложенных таких же тегов;-->
    <!--    2-->
    <!--    ■ метод для установки атрибута;-->
    <!--    ■ метод для установки стиля;-->
    <!--    ■ метод для добавления вложенного элемента в конец теку- -->
    <!--    щего элемента;-->
    <!--    ■ метод для добавления вложенного элемента в начало те- -->
    <!--    кущего элемента;-->
    <!--    ■ метод getHtml(), который возвращает html код в виде-->
    <!--    строки, включая html код вложенных элементов.-->
    <!--    С помощью написанного класса реализовать следующий блок-->
    <!--    и добавить его на страницу с помощью document.write().-->
    <script>
        class HtmlElement {
            constructor(name, isVoid, text) {
                this.name = name;
                this.isVoid = isVoid;
                this.text = text;
                this.attributes = [];
                this.cssProperties = [];
                this.nestingElements = [];
            }

            setAttribute(attribute) {
                this.attributes.push(attribute);
            }

            setCssProperty(cssProperty) {
                this.cssProperties.push(cssProperty);
            }

            pushNestingElement(newHtmlElement) {
                this.nestingElements.push(newHtmlElement);
            }

            unshiftNestingElement(newHtmlElement) {
                this.nestingElements.unshift(newHtmlElement);
            }

            getHtml() {
                let html = "<" + this.name + " ";

                this.attributes.forEach(attribute => html += ` ${attribute.name}="${attribute.value}"`);

                if (this.cssProperties.length !== 0) {
                    html += 'style="';
                    this.cssProperties.forEach(cssProperties => html += `${cssProperties.name}: ${cssProperties.value};`);
                    html += '"';
                }

                if (this.isVoid) {
                    html += "/>";

                } else {
                    html += ">";
                    html += this.text;
                    this.nestingElements.forEach(element => html += element.getHtml());
                    html += `</${this.name}>`;
                }
                return html;
            }
        }

        const p = new HtmlElement("p", false, "Lorem ipsum dolor sit amet, consectetur adipisicing elit. Expedita ipsa possimus sed. Adipisci exercitationem iste itaque molestias necessitatibus. Amet aspernatur deserunt, hic illo optio porro quas quibusdam veniam voluptate voluptatibus!");
        p.setCssProperty(
            {
                name: "text-align",
                value: "justify"
            }
        );
        const a = new HtmlElement("a", false, "More...");
        a.setAttribute(
            {
                name: "href",
                value: "https://www.lipsum.com/"
            }
        );
        a.setAttribute(
            {
                name: "target",
                value: "_blank"
            }
        );


        const img = new HtmlElement("img", true, "");
        img.setAttribute({
            name: "style",
            value: "width: 100%"
        });
        img.setAttribute({
            name: "src",
            value: "lipsum.jpg"
        });
        img.setAttribute({
            name: "alt",
            value: "Lorem Ipsum"
        });

        const h3 = new HtmlElement("h3", false, "What is Lorem Ipsum?");
        // p.pushNestingElement(h3);
        // const div = new HtmlElement("div", false, h3.getHtml() + img.getHtml() + p.getHtml()+a.getHtml());
        const div = new HtmlElement("div", false, "");
        div.pushNestingElement(h3);
        div.pushNestingElement(img);
        div.pushNestingElement(p);
        p.pushNestingElement(a);
        div.setCssProperty(
            {
                name: "width",
                value: "300px"
            }
        );
        div.setCssProperty(
            {
                name: "margin",
                value: "10px"
            }
        );
        const div1 = new HtmlElement("div", false, div.getHtml());
        div1.setAttribute(
            {
                name: "id",
                value: "wrapper"
            });
        div1.setCssProperty(
            {
                name: "display",
                value: "flex"
            }
        );
        div1.pushNestingElement(div);

        document.write(div1.getHtml());

    </script>
</head>
<body>


</body>
</html>
