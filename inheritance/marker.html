<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marker</title>
    <script>
        class Marker {
            constructor(color, inkPercentage) {
                this.color = color;
                this.inkPercentage = inkPercentage;
            }

            print(text) {
                let content="";
                for (let i = 0; i < text.length && this.inkPercentage >= 0.5; i++) {
                    content+=text.charAt(i);
                    if (text.charAt(i) !== " ") {
                        this.inkPercentage -= 0.5;
                    }
                }
                document.write(`<p style="color: ${this.color}">${content}</p>`)
            }
        }

        class RechargeableMarker extends Marker {
            recharge(inkValue) {
                this.inkPercentage += inkValue;
                if (this.inkPercentage > 100) {
                    this.inkPercentage = 100
                }
            }
        }
        let marker=new RechargeableMarker("darkgreen",3);
        marker.recharge(0);
        marker.print("12, 456 7");
    </script>
</head>
<body>

</body>
</html>
